<title>Statistique générale L1 — exemple (5 questions)</title>

<body>
<script>
const ALL_QUESTIONS=[
{id:1,cat:"I",type:"QCM",os:"OS1",theme:"But de la statistique",q:"Dans un centre de santé, quel est le but principal d’une étude statistique des motifs de consultation ?",opts:["Remplacer l’examen clinique","Dégager une signification à partir des observations","Modifier les dossiers de consultation","Supprimer les variations entre patients"],ans:["Dégager une signification à partir des observations"],exp:"La statistique dégage une signification à partir des observations, elle ne remplace pas l’examen clinique."},
{id:2,cat:"I",type:"QCD",os:"OS1",theme:"Données statistiques et méthode statistique",q:"Une liste brute des températures relevées dans un réfrigérateur vaccinal constitue, à elle seule, une méthode statistique complète.",opts:["Vrai","Faux"],ans:["Faux"],exp:"Une liste brute n’est que des données. La méthode statistique exige collecte, traitement, analyse, diffusion."},
{id:27,cat:"II-Freq",type:"QCM",os:"OS3",theme:"Fréquence d’une modalité",q:"Sur 80 consultations, 20 ont pour motif principal la diarrhée. Quelle est la fréquence en pourcentage ?",opts:["20 %","40 %","25 %","80 %"],ans:["25 %"],exp:"20 / 80 = 0,25 = 25 %."},
{id:41,cat:"II-Graph",type:"QCM",os:"OS4",theme:"Calcul de l’angle d’un secteur semi-circulaire",q:"Dans un diagramme semi-circulaire, quel angle correspond à une fréquence de 40 % ?",opts:["40°","144°","72°","180°"],ans:["72°"],exp:"Semi-circulaire = 180°. 0,40 × 180° = 72°. Piège : en circulaire complet ce serait 144°."},
{id:47,cat:"II-2var",type:"QCM",os:"OS5",theme:"Variance",q:"Pour les observations 1, 2 et 3, quelle est la variance descriptive V = Σ(xᵢ − x̄)² / 3 ?",opts:["1","2/3","3/2","2"],ans:["2/3"],exp:"x̄ = 2. (1-2)² + (2-2)² + (3-2)² = 1+0+1 = 2. V = 2/3."}
];
</script>
