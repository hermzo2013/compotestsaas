<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompoTest</title>
<style>
:root{--blue:#2457d6;--navy:#132344;--bg:#f4f7fc;--ink:#1d2940;--muted:#6c7890;--line:#e1e7f0;--green:#16865c;--red:#e11d48}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#132344,#2457d6);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:800}.brand span{color:#8fe4c0}
.header-actions{display:flex;gap:10px;align-items:center;font-size:13px}
.header-actions button{padding:6px 12px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;cursor:pointer}
.wrap{max-width:900px;margin:30px auto;padding:0 20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.03);margin-bottom:20px}
h1{font-size:24px;margin-top:0}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 5px}
input,select,textarea{width:100%;border:1px solid #d5ddeb;border-radius:10px;padding:12px;font:inherit}
button{border:0;border-radius:10px;background:var(--blue);color:white;font-weight:700;padding:12px 20px;cursor:pointer;font:inherit;transition:.2s}
button:hover{filter:brightness(1.1)}button.secondary{background:#edf2ff;color:#244fc2}button.ghost{background:#f0f3f8;color:#34435c}
button.success{background:var(--green);font-size:16px;padding:15px 25px}button.danger{background:#fff0f0;color:#b82e36}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.filebox{border:2px dashed #a9bce7;border-radius:12px;padding:20px;background:#f8faff;text-align:center}
.hide{display:none!important}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.notice{padding:12px;border-radius:10px;background:#fff7df;color:#74500b;font-size:13px;margin-top:15px;border-left:4px solid #f59e0b}
.notice.err{background:#fff0f0;color:#a51f2a;border-color:#ef4444}
.notice.ok{background:#e9f8f1;color:#0e5e3f;border-color:#10b981}
.tabs{display:flex;gap:5px;margin-bottom:20px;border-bottom:2px solid var(--line);padding-bottom:10px}
.tab{padding:10px 15px;border-radius:8px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);border:0}
.tab.active{background:#edf2ff;color:var(--blue)}
.history-item{background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:15px}
.admin-table th,.admin-table td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
.admin-table th{color:var(--muted)}
.badge-admin{display:inline-block;background:#fef3c7;color:#92400e;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:6px}

#examView{display:none;position:fixed;inset:0;background:#f4f7fc;z-index:2000;overflow-y:auto;padding-bottom:100px}
.exam-header{background:#132344;color:#fff;padding:15px 25px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.exam-header h2{margin:0;font-size:18px}
.exam-body{max-width:800px;margin:25px auto;padding:0 20px}
.exam-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:25px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.02)}
.exam-card h3{font-size:17px;margin-top:0;margin-bottom:20px;line-height:1.5;color:#1e293b;text-align:left}
.exam-q-num{display:inline-block;background:var(--blue);color:#fff;font-weight:800;font-size:11px;padding:4px 10px;border-radius:99px;margin-bottom:12px}
.exam-options { display: flex !important; flex-direction: column !important; gap: 12px !important; width: 100% !important; }
.exam-opt { display: flex !important; flex-direction: row !important; align-items: flex-start !important; justify-content: flex-start !important; gap: 15px !important; padding: 16px !important; border: 1.5px solid var(--line) !important; border-radius: 10px !important; cursor: pointer !important; background: #fff !important; transition: .1s !important; text-align: left !important; }
.exam-opt:hover { background: #f8faff !important; border-color: #a9bce7 !important; }
.exam-opt.selected { border-color: var(--blue) !important; background: #edf2ff !important; }
.exam-opt.correct { border-color: var(--green) !important; background: #e9f8f1 !important; }
.exam-opt.wrong { border-color: var(--red) !important; background: #fff1f2 !important; }
.exam-opt input[type="radio"], .exam-opt input[type="checkbox"] { margin: 2px 0 0 0 !important; width: 20px !important; height: 20px !important; cursor: pointer !important; flex-shrink: 0 !important; display: inline-block !important; }
.exam-opt span { flex: 1 !important; text-align: left !important; line-height: 1.4 !important; word-wrap: break-word !important; display: block !important; }
.exam-input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;margin-top:10px;text-align:left}
.exam-actions{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:15px 25px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:10;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.exam-actions-left { font-size: 14px; color: var(--muted); font-weight: bold; }
.exam-actions-right { display: flex; gap: 10px; }
.exam-result-box{background:#e9f8f1;padding:18px;border-radius:10px;margin-top:20px;border-left:4px solid var(--green);font-size:14px;text-align:left}
.exam-result-box.wrong{background:#fff1f2;border-color:var(--red)}
.exam-explain{font-size:13px;color:#475569;margin-top:12px;padding:12px;background:#f8faff;border-radius:8px;border-left:2px solid var(--blue)}
@media(max-width:600px){ .grid-2{grid-template-columns:1fr} .exam-body{padding:0 12px} .exam-actions { flex-direction: column; gap: 10px; padding: 10px; } .exam-actions-right { width: 100%; justify-content: space-between; } .exam-actions-right button { flex: 1; } }
</style>
</head><body>

<header>
  <div class="brand">Compo<span>Test</span></div>
  <div class="header-actions">
    <span id="userLabel">Non connecté</span>
    <button id="pwdBtn" style="display:none">🔑 Mot de passe</button>
    <button id="logoutBtn" style="display:none">Déconnexion</button>
  </div>
</header>

<section id="authGate" class="wrap" style="display:none">
  <div class="panel" style="max-width:400px;margin:50px auto">
    <h1 style="text-align:center">Connexion</h1>
    <form id="loginForm">
      <label for="loginEmail">Identifiant ou Email</label>
      <input id="loginEmail" type="text" required>
      <label for="loginPassword">Mot de passe</label>
      <input id="loginPassword" type="password" required>
      <button type="submit" style="width:100%;margin-top:15px">Se connecter</button>
    </form>
    <div id="authError" style="color:var(--red);font-size:13px;margin-top:10px;text-align:center"></div>
  </div>
</section>

<main id="mainApp" class="wrap" style="display:none">
  <div class="tabs">
    <button class="tab active" data-tab="create">📚 Créer un test</button>
    <button class="tab" data-tab="history">📊 Mon Historique</button>
    <button class="tab hide" id="tabAdminBtn" data-tab="admin">⚙️ Admin</button>
  </div>

  <div id="tab-create" class="tab-content">
    <div class="panel">
      <h1>Importer un document</h1>
      <div class="grid-2">
        <div><label for="quizTitle">Titre</label><input id="quizTitle" placeholder="Ex. Examen Blanc"></div>
        <div><label for="quizSubject">Matière</label><input id="quizSubject" placeholder="Ex. Immunologie"></div>
      </div>
      <label>Fichier (PDF, DOCX, TXT)</label>
      <div class="filebox">
        <input id="pdfFile" type="file" accept=".pdf,.docx,.txt" style="display:none">
        <button class="secondary" onclick="document.getElementById('pdfFile').click()">📄 Choisir un fichier</button>
        <span id="fileName" style="margin-left:10px;font-weight:600;font-size:14px;color:var(--blue)">Aucun fichier</span>
        <div id="pdfStatus" style="font-size:12px;color:var(--muted);margin-top:10px"></div>
      </div>
      <div id="textAreaWrap" class="hide" style="margin-top:20px">
        <label for="pdfText">Texte extrait</label>
        <textarea id="pdfText" style="min-height:150px"></textarea>
      </div>
      <div class="actions" id="actionButtons" style="margin-top:25px;display:none;justify-content:center;gap:20px">
        <button id="generatePostTestBtn" class="success" style="flex:1;text-align:left;padding:15px;">
          <div style="font-size:16px;font-weight:800">✨ GÉNÉRER 50 QUESTIONS (IA)</div>
        </button>
        <button id="extractTestBtn" class="secondary" style="flex:1;text-align:left;padding:15px;">
          <div style="font-size:16px;font-weight:800">📋 EXTRAIRE QUESTIONNAIRE</div>
        </button>
      </div>
      <div id="analysisStatus" class="notice hide"></div>
    </div>
  </div>

  <div id="tab-history" class="tab-content hide">
    <div class="panel">
      <h1>Mon Historique</h1>
      <div id="historyList"></div>
    </div>
  </div>

  <div id="tab-admin" class="tab-content hide">
    <div class="panel">
      <h1>Administration des comptes</h1>
      <h3>Créer un compte</h3>
      <form id="adminCreateForm" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
        <div style="flex:1"><label>Nom d'utilisateur</label><input id="newName" required placeholder="maroane"></div>
        <div style="flex:1"><label>Email interne</label><input id="newEmail" required placeholder="maroane@comptest.local"></div>
        <div style="flex:1"><label>Mot de passe</label><input id="newPassword" type="text" required minlength="6"></div>
        <button type="submit" style="margin-bottom:2px">Créer</button>
      </form>
      <div id="adminStatus" style="font-size:13px;margin-top:10px;color:var(--green)"></div>
      <h3 style="margin-top:30px">Comptes existants</h3>
      <div id="adminUsersList">Chargement...</div>
    </div>
  </div>
</main>

<div id="examView">
  <div class="exam-header">
    <div><h2 id="examTitle">Test</h2><div id="examMeta" style="font-size:12px;opacity:.8"></div></div>
    <button class="ghost" id="examQuitBtn" style="background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.3)">← Quitter</button>
  </div>
  <div class="exam-body" id="examBody"></div>
  <div class="exam-actions">
    <div class="exam-actions-left" id="examProgressText">Question 1 / 50</div>
    <div class="exam-actions-right">
      <button id="examPrevBtn" class="secondary">Précédent</button>
      <button id="examNextBtn">Suivant →</button>
      <button id="examSubmitBtn" class="success" style="display:none">✓ SOUMETTRE LA COMPO</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/j
