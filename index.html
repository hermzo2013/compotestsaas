<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompoTest — Générateur de Post-Test</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
:root{--blue:#2457d6;--navy:#132344;--bg:#f4f7fc;--ink:#1d2940;--muted:#6c7890;--line:#e1e7f0;--green:#16865c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#132344,#2457d6);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.brand span{color:#8fe4c0}
.header-actions{display:flex;gap:10px;font-size:12px}
.header-actions button{padding:6px 12px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;cursor:pointer}
.wrap{max-width:900px;margin:30px auto;padding:0 20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.03)}
h1{font-size:24px;margin-top:0}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 5px}
input,select,textarea{width:100%;border:1px solid #d5ddeb;border-radius:10px;padding:12px;font:inherit}
button{border:0;border-radius:10px;background:var(--blue);color:white;font-weight:700;padding:12px 20px;cursor:pointer;font:inherit;transition:.2s}
button:hover{filter:brightness(1.1)}button.secondary{background:#edf2ff;color:#244fc2}button.ghost{background:#f0f3f8;color:#34435c}
button.success{background:var(--green);font-size:16px;padding:15px 25px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.filebox{border:2px dashed #a9bce7;border-radius:12px;padding:20px;background:#f8faff;text-align:center}
.hide{display:none!important}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.notice{padding:12px;border-radius:10px;background:#fff7df;color:#74500b;font-size:13px;margin-top:15px;border-left:4px solid #f59e0b}
.notice.err{background:#fff0f0;color:#a51f2a;border-color:#ef4444}
.notice.ok{background:#e9f8f1;color:#0e5e3f;border-color:#10b981}
.hidden-file{display:none}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#edf2ff;color:#244fc2}
.badge.green{background:#e9f8f1;color:#13734e}

/* MODAL POST-TEST PLEIN ÉCRAN */
#examView{display:none;position:fixed;inset:0;background:#f4f7fc;z-index:2000;overflow-y:auto;padding-bottom:80px}
.exam-header{background:#132344;color:#fff;padding:15px 25px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.exam-header h2{margin:0;font-size:18px}
.exam-body{max-width:800px;margin:25px auto;padding:0 20px}
.exam-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.02)}
.exam-card h3{font-size:16px;margin-top:0;margin-bottom:15px;line-height:1.4}
.exam-q-num{display:inline-block;background:var(--blue);color:#fff;font-weight:800;font-size:11px;padding:3px 8px;border-radius:99px;margin-bottom:10px}
.exam-options{display:flex;flex-direction:column;gap:10px}
.exam-opt{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;transition:.1s}
.exam-opt:hover{background:#f8faff;border-color:#a9bce7}
.exam-opt.selected{border-color:var(--blue);background:#edf2ff}
.exam-opt.correct{border-color:#16865c;background:#e9f8f1}
.exam-opt.wrong{border-color:#e11d48;background:#fff1f2}
.exam-opt input{margin-top:3px;cursor:pointer}
.exam-input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
.exam-actions{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:15px 25px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:10}
.exam-result-box{background:#e9f8f1;padding:15px;border-radius:10px;margin-top:15px;border-left:4px solid #10b981;font-size:14px}
.exam-result-box.wrong{background:#fff1f2;border-color:#e11d48}
.exam-explain{font-size:13px;color:#475569;margin-top:10px;padding:10px;background:#f8faff;border-radius:8px}

@media(max-width:600px){ .grid-2{grid-template-columns:1fr} .exam-body{padding:0 12px} }
</style>
</head><body>

<!-- HEADER -->
<header>
  <div class="brand">Compo<span>Test</span></div>
  <div class="header-actions">
    <span id="authUserLabel">Espace privé</span>
    <button id="passwordPanelBtn" type="button" hidden>🔑 Mdp</button>
    <button id="logoutBtn" type="button" hidden>Déconnexion</button>
  </div>
</header>

<!-- AUTH GATE -->
<section id="authGate" class="wrap">
  <div class="panel" style="max-width:400px;margin:50px auto">
    <h1 style="text-align:center">Connexion</h1>
    <form id="loginForm">
      <label for="loginEmail">Identifiant ou E-mail</label>
      <input id="loginEmail" type="text" required placeholder="maroane ou maroane@exemple.com">
      <label for="loginPassword">Mot de passe</label>
      <input id="loginPassword" type="password" required>
      <button id="loginBtn" type="submit" style="width:100%;margin-top:15px">Se connecter</button>
    </form>
    <div id="authError" style="color:#e11d48;font-size:12px;margin-top:10px;text-align:center"></div>
    <div style="text-align:center;margin-top:15px;font-size:12px"><a href="#" id="forgotPasswordBtn" style="color:#2457d6;text-decoration:none">Mot de passe oublié ?</a></div>
  </div>
</section>

<!-- APP MAIN -->
<main id="appMain" class="wrap" style="display:none">
  <div class="panel">
    <h1 id="appTitle">📚 Créer un test</h1>
    <p style="color:var(--muted);margin-top:-10px">Importez un document pour générer un nouveau quiz ou extraire les questions existantes.</p>

    <div class="grid-2">
      <div>
        <label for="quizTitle">Titre du test</label>
        <input id="quizTitle" placeholder="Ex. Post-Test Immunologie" value="">
      </div>
      <div>
        <label for="quizSubject">Matière</label>
        <input id="quizSubject" placeholder="Ex. Immunologie">
      </div>
    </div>

    <label>Fichier source (PDF, Word, TXT)</label>
    <div class="filebox">
      <input id="pdfFile" type="file" accept=".pdf,.docx,.txt" style="display:none">
      <button class="secondary" onclick="document.getElementById('pdfFile').click()">📄 Choisir un fichier</button>
      <span id="fileName" style="margin-left:10px;font-weight:600;font-size:14px;color:var(--blue)">Aucun fichier sélectionné</span>
      <div id="pdfStatus" style="font-size:12px;color:var(--muted);margin-top:10px">Formats : PDF, DOCX, TXT</div>
    </div>

    <div id="textAreaWrap" class="hide" style="margin-top:20px">
      <label for="pdfText">Texte extrait (vérifiez et modifiez si besoin)</label>
      <textarea id="pdfText" style="min-height:200px" placeholder="Le texte apparaîtra ici après extraction."></textarea>
    </div>

    <!-- LES 2 BOUTONS MAGIQUES -->
    <div class="actions" id="actionButtons" style="margin-top:25px;display:none;justify-content:center;gap:20px">
      <button id="generatePostTestBtn" class="success" style="flex:1;max-width:300px">
        ✨ GÉNÉRER UN POST-TEST<br>
        <span style="font-size:11px;font-weight:normal;opacity:0.9">(Créer des questions à partir du cours)</span>
      </button>
      
      <button id="extractTestBtn" class="secondary" style="flex:1;max-width:300px">
        📋 EXTRAIRE UN QUESTIONNAIRE<br>
        <span style="font-size:11px;font-weight:normal;opacity:0.9">(Le document contient déjà des questions)</span>
      </button>
    </div>

    <div id="analysisStatus" class="notice hide"></div>
  </div>
</main>

<!-- ============================================== -->
<!-- VUE POST-TEST PLEIN ÉCRAN (Comme Gemini) -->
<!-- ============================================== -->
<div id="examView">
  <div class="exam-header">
    <div>
      <h2 id="examTitle">Post-Test</h2>
      <div id="examMeta" style="font-size:12px;opacity:.8"></div>
    </div>
    <button class="ghost" id="examQuitBtn" style="background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.3)">← Quitter</button>
  </div>
  
  <div class="exam-body" id="examBody">
    <!-- Les questions s'injectent ici par JS -->
  </div>

  <div class="exam-actions" id="examActionsBar">
    <div style="font-size:14px;color:var(--muted)" id="examProgressText">Question 1 / 10</div>
    <div style="display:flex;gap:10px">
      <button id="examPrevBtn" class="secondary">Précédent</button>
      <button id="examNextBtn">Suivant →</button>
      <button id="examSubmitBtn" class="success hide">✓ Valider mes réponses</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const INTERNAL_DOMAIN='comptest.local';
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let activeUserId=null;
let examState=null; // Contiendra les questions et l'état du test en cours

// Utilitaires
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function identifierToEmail(input){const v=String(input||'').trim().toLowerCase();if(!v)return '';if(v.includes('@'))return v;return v.replace(/[^a-z0-9._-]/g,'')+'@'+INTERNAL_DOMAIN}

// ==========================================
// AUTHENTIFICATION
// ==========================================
async function initSaaS(){
  const cfg=window.COMPOSTEST_CONFIG||{};
  if(!window.supabase||!cfg.SUPABASE_URL){alert('Config Supabase manquante');return}
  const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  window.compTestAuth=client;
  
  client.auth.onAuthStateChange((_e,session)=>{
    if(session){
      activeUserId=session.user.id;
      $('authGate').style.display='none';
      $('appMain').style.display='block';
      $('logoutBtn').hidden=false;
      $('passwordPanelBtn').hidden=false;
      $('authUserLabel').textContent=session.user.email.split('@')[0];
    } else {
      activeUserId=null;
      $('authGate').style.display='block';
      $('appMain').style.display='none';
      $('logoutBtn').hidden=true;
      $('passwordPanelBtn').hidden=true;
    }
  });

  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=$('loginBtn'); btn.disabled=true; btn.textContent='...';
    const email=identifierToEmail($('loginEmail').value);
    const {error}=await client.auth.signInWithPassword({email,password:$('loginPassword').value});
    if(error) $('authError').textContent = 'Erreur : ' + error.message;
    else $('authError').textContent = '';
    btn.disabled=false; btn.textContent='Se connecter';
  });

  $('logoutBtn').addEventListener('click',()=>client.auth.signOut());
}
initSaaS();

// ==========================================
// LOGIQUE D'IMPORTATION (PDF, WORD, TXT)
// ==========================================
$('pdfFile').addEventListener('change', function() {
  if(this.files.length > 0) {
    $('fileName').textContent = this.files[0].name;
    extractText(this.files[0]);
  }
});

function cleanExtractedText(text){
  if(!text)return '';
  let cleaned=text;
  // Nettoyage basique
  cleaned=cleaned.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,'');
  return cleaned.trim();
}

async function extractText(file){
  const status=$('pdfStatus');
  status.textContent='Extraction en cours...';
  const name=file.name.toLowerCase();
  
  try{
    let text='';
    if(name.endsWith('.pdf')){
      const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      let pages=[];
      for(let p=1;p<=pdf.numPages;p++){
        const page=await pdf.getPage(p);
        const content=await page.getTextContent();
        const items=content.items.map(i=>i.str);
        pages.push(items.join(' '));
      }
      text=pages.join('\n\n');
    } else if(name.endsWith('.docx')){
      const zip=await JSZip.loadAsync(await file.arrayBuffer());
      const docXml=zip.file('word/document.xml');
      if(!docXml) throw new Error('Fichier Word invalide.');
      const xml=await docXml.async('string');
      // Extraction simple du texte entre les balises <w:t>
      text = xml.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
    } else if(name.endsWith('.txt')){
      text=await file.text();
    }
    
    text = cleanExtractedText(text);
    if(text.length < 50) throw new Error('Le document semble vide ou illisible.');
    
    $('pdfText').value = text;
    $('textAreaWrap').classList.remove('hide');
    $('actionButtons').style.display = 'flex';
    status.textContent = `✅ ${text.length} caractères extraits. Prêt à générer.`;
    status.style.color = 'var(--green)';
    
  } catch(e) {
    status.textContent = 'Erreur : ' + e.message;
    status.style.color = 'red';
  }
}

// ==========================================
// BOUTON 1 : GÉNÉRER UN POST-TEST (IA)
// ==========================================
$('generatePostTestBtn').addEventListener('click', async () => {
  const text = $('pdfText').value.trim();
  if(!text) return;
  
  const btn = $('generatePostTestBtn');
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ Génération en cours...';
  btn.disabled = true;
  
  const status = $('analysisStatus');
  status.classList.remove('hide', 'err', 'ok');
  status.textContent = 'L\'IA analyse le cours et prépare les questions...';
  
  try {
    const session = await window.compTestAuth.auth.getSession();
    const token = session.data.session.access_token;
    
    const res = await fetch('/api/analyze-course', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({
        subject: $('quizSubject').value.trim() || 'Cours',
        title: $('quizTitle').value.trim() || 'Post-Test',
        sourceText: text,
        count: 15 // On génère 15 questions par défaut
      })
    });
    
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Erreur lors de la génération');
    
    if(data.questions && data.questions.length > 0) {
      status.className = 'notice ok';
      status.textContent = `✅ ${data.questions.length} questions générées avec succès !`;
      
      // On lance la vue "Post-Test"
      startExam({
        title: $('quizTitle').value.trim() || 'Post-Test',
        subject: $('quizSubject').value.trim() || 'Généré par IA',
        questions: data.questions
      });
    } else {
      throw new Error('L\'IA n\'a pas renvoyé de questions.');
    }
    
  } catch (err) {
    status.className = 'notice err';
    status.textContent = '❌ ' + err.message;
  } finally {
    btn.innerHTML = originalText;
    btn.disabled = false;
  }
});

// ==========================================
// BOUTON 2 : EXTRAIRE UN QUESTIONNAIRE EXISTANT
// ==========================================
$('extractTestBtn').addEventListener('click', () => {
  const text = $('pdfText').value;
  if(!text) return;
  
  const status = $('analysisStatus');
  status.classList.remove('hide', 'err', 'ok');
  status.textContent = 'Analyse du document pour trouver des questions...';
  
  // Logique simple d'extraction (regex) pour le frontend
  const lines = text.split('\n');
  let questions = [];
  let currentQ = null;
  
  const qRegex = /^(?:Q\s*)?(\d{1,3})[.)]\s+(.+)$/i;
  
  lines.forEach(line => {
    const m = line.match(qRegex);
    if(m) {
      if(currentQ) questions.push(currentQ);
      currentQ = { num: m[1], text: m[2], options: [], correct: null, type: 'mcq' };
    } else if (currentQ) {
      // Détection des options A, B, C...
      const optMatch = line.match(/^([A-D])[.)]\s+(.+)$/i);
      if(optMatch) {
        currentQ.options.push(optMatch[2].trim());
      } else if (line.trim()) {
        currentQ.text += ' ' + line.trim();
      }
    }
  });
  if(currentQ) questions.push(currentQ);
  
  if(questions.length > 0) {
    // Nettoyage et formatage
    const formatted = questions.map((q, i) => ({
      id: `ext-${i}`,
      number: i + 1,
      type: q.options.length > 0 ? 'mcq' : 'short',
      text: q.text,
      options: q.options,
      correct: 0, // Par défaut, à corriger par l'utilisateur si besoin
      explanation: 'Question extraite du document.'
    }));
    
    status.className = 'notice ok';
    status.textContent = `✅ ${formatted.length} questions détectées dans le texte.`;
    
    startExam({
      title: 'Extraction : ' + ($('quizTitle').value || 'Document'),
      subject: 'Questions importées',
      questions: formatted
    });
  } else {
    status.className = 'notice err';
    status.textContent = '❌ Aucune question numérotée (1., 2., Q1...) trouvée dans le texte.';
  }
});

// ==========================================
// MOTEUR DE LA PAGE "POST-TEST" (FULLSCREEN)
// ==========================================
function startExam(quiz) {
  examState = {
    title: quiz.title,
    subject: quiz.subject,
    questions: quiz.questions,
    answers: new Array(quiz.questions.length).fill(null),
    currentIndex: 0,
    submitted: false
  };
  
  $('examTitle').textContent = quiz.title;
  $('examMeta').textContent = `${quiz.questions.length} questions · ${quiz.subject}`;
  $('examView').style.display = 'block';
  document.body.style.overflow = 'hidden'; // Empêche le scroll derrière
  
  renderExamQuestion();
}

$('examQuitBtn').addEventListener('click', () => {
  if(!examState.submitted) {
    if(!confirm('Quitter le test ? Vos réponses seront perdues.')) return;
  }
  $('examView').style.display = 'none';
  document.body.style.overflow = 'auto';
  examState = null;
});

function renderExamQuestion() {
  if(!examState) return;
  const i = examState.currentIndex;
  const q = examState.questions[i];
  const ua = examState.answers[i];
  const total = examState.questions.length;

  // Barre de progression
  $('examProgressText').textContent = `Question ${i + 1} / ${total}`;
  
  // Navigation
  $('examPrevBtn').style.display = i > 0 ? 'block' : 'none';
  $('examNextBtn').style.display = i < total - 1 ? 'block' : 'none';
  $('examSubmitBtn').style.display = i === total - 1 ? 'block' : 'none';

  // Contenu de la question
  let html = `<div class="exam-card">
    <span class="exam-q-num">Question ${i + 1}</span>
    <h3>${esc(q.text)}</h3>`;
    
  if(q.type === 'mcq' || q.type === 'mcq_multi') {
    html += `<div class="exam-options">`;
    q.options.forEach((opt, j) => {
      const isSelected = q.type === 'mcq_multi' 
        ? (Array.isArray(ua) && ua.includes(j))
        : (ua === j);
        
      let cls = 'exam-opt' + (isSelected ? ' selected' : '');
      
      // Si déjà soumis, on montre les couleurs
      if(examState.submitted) {
        const isCorrect = q.type === 'mcq_multi' ? q.correct.includes(j) : q.correct === j;
        if(isCorrect) cls += ' correct';
        else if(isSelected && !isCorrect) cls += ' wrong';
      }
      
      html += `<label class="${cls}">
        <input type="${q.type === 'mcq_multi' ? 'checkbox' : 'radio'}" 
               name="exam_q${i}" value="${j}" 
               ${isSelected ? 'checked' : ''} 
               ${examState.submitted ? 'disabled' : ''}>
        <span>${esc(opt)}</span>
      </label>`;
    });
    html += `</div>`;
  } else if (q.type === 'tf') {
    html += `<div class="exam-options">`;
    [true, false].forEach(v => {
      const isSelected = ua === v;
      let cls = 'exam-opt' + (isSelected ? ' selected' : '');
      if(examState.submitted) {
        if(q.correct === v) cls += ' correct';
        else if(isSelected && q.correct !== v) cls += ' wrong';
      }
      html += `<label class="${cls}">
        <input type="radio" name="exam_q${i}" value="${v}" 
               ${isSelected ? 'checked' : ''} ${examState.submitted ? 'disabled' : ''}>
        <span>${v ? 'Vrai' : 'Faux'}</span>
      </label>`;
    });
    html += `</div>`;
  } else {
    // Réponse courte
    let cls = 'exam-input';
    if(examState.submitted) {
      const ok = String(ua).trim().toLowerCase() === String(q.correct).trim().toLowerCase();
      cls += ok ? ' correct' : ' wrong';
    }
    html += `<input type="text" class="${cls}" id="examTextInput" placeholder="Votre réponse..." 
             value="${esc(ua || '')}" ${examState.submitted ? 'disabled' : ''}>`;
  }

  // Affichage de la correction
  if(examState.submitted) {
    const isOk = isAnswerCorrect(q, ua);
    html += `<div class="exam-result-box ${isOk ? '' : 'wrong'}">
      <b>${isOk ? '✅ Correct' : '❌ Incorrect'}</b>
      ${q.correct !== undefined && q.correct !== null ? `<br><b>Bonne réponse :</b> ${esc(getCorrectLabel(q))}` : ''}
      ${q.explanation ? `<div class="exam-explain"><b>Explication :</b> ${esc(q.explanation)}</div>` : ''}
    </div>`;
  }

  html += `</div>`;
  $('examBody').innerHTML = html;

  // Écouteurs d'événements pour sauvegarder la réponse
  if(!examState.submitted) {
    if(q.type === 'mcq' || q.type === 'tf') {
      document.querySelectorAll(`input[name="exam_q${i}"]`).forEach(inp => {
        inp.addEventListener('change', () => {
          if(q.type === 'tf') examState.answers[i] = inp.value === 'true';
          else examState.answers[i] = parseInt(inp.value);
        });
      });
    } else if(q.type === 'mcq_multi') {
      document.querySelectorAll(`input[name="exam_q${i}"]`).forEach(inp => {
        inp.addEventListener('change', () => {
          let vals = [...document.querySelectorAll(`input[name="exam_q${i}"]:checked`)].map(x => parseInt(x.value));
          examState.answers[i] = vals;
        });
      });
    } else {
      const inp = $('examTextInput');
      if(inp) {
        inp.addEventListener('input', (e) => {
          examState.answers[i] = e.target.value;
        });
      }
    }
  }
}

function getCorrectLabel(q) {
  if(q.type === 'tf') return q.correct ? 'Vrai' : 'Faux';
  if(q.type === 'mcq_multi') return q.correct.map(c => q.options[c]).join(', ');
  if(q.type === 'mcq') return q.options[q.correct];
  return q.correct;
}

function isAnswerCorrect(q, ua) {
  if(ua === null || ua === undefined) return false;
  if(q.type === 'mcq') return ua === q.correct;
  if(q.type === 'mcq_multi') {
    const a = Array.isArray(ua) ? [...ua].sort() : [];
    const b = (Array.isArray(q.correct) ? q.correct : [q.correct]).sort();
    return a.length === b.length && a.every((v,i) => v === b[i]);
  }
  if(q.type === 'tf') return ua === q.correct;
  if(q.type === 'short') return String(ua).trim().toLowerCase() === String(q.correct || '').trim().toLowerCase();
  return false;
}

$('examNextBtn').addEventListener('click', () => {
  if(examState.currentIndex < examState.questions.length - 1) {
    examState.currentIndex++;
    renderExamQuestion();
  }
});

$('examPrevBtn').addEventListener('click', () => {
  if(examState.currentIndex > 0) {
    examState.currentIndex--;
    renderExamQuestion();
  }
});

$('examSubmitBtn').addEventListener('click', () => {
  if(examState.submitted) return;
  
  const unanswered = examState.answers.filter(a => a === null || a === undefined || a === '').length;
  if(unanswered > 0) {
    if(!confirm(`Il reste ${unanswered} question(s) sans réponse. Valider quand même ?`)) return;
  }
  
  examState.submitted = true;
  $('examSubmitBtn').style.display = 'none';
  $('examNextBtn').style.display = 'none';
  $('examPrevBtn').style.display = 'none';
  $('examProgressText').innerHTML = '<b style="color:var(--green)">Test terminé !</b>';
  
  renderExamQuestion(); // Re-render avec les corrections
});

</script>
</body></html>
