<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompoTest — Générateur de Post-Test</title>
<style>
:root{--blue:#2457d6;--navy:#132344;--bg:#f4f7fc;--ink:#1d2940;--muted:#6c7890;--line:#e1e7f0;--green:#16865c;--red:#e11d48}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#132344,#2457d6);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:800}.brand span{color:#8fe4c0}
.wrap{max-width:900px;margin:30px auto;padding:0 20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.03)}
h1{font-size:24px;margin-top:0}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 5px}
input,select,textarea{width:100%;border:1px solid #d5ddeb;border-radius:10px;padding:12px;font:inherit}
button{border:0;border-radius:10px;background:var(--blue);color:white;font-weight:700;padding:12px 20px;cursor:pointer;font:inherit;transition:.2s}
button:hover{filter:brightness(1.1)}button.secondary{background:#edf2ff;color:#244fc2}button.ghost{background:#f0f3f8;color:#34435c}
button.success{background:var(--green);font-size:16px;padding:15px 25px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.filebox{border:2px dashed #a9bce7;border-radius:12px;padding:20px;background:#f8faff;text-align:center}
.hide{display:none!important}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.notice{padding:12px;border-radius:10px;background:#fff7df;color:#74500b;font-size:13px;margin-top:15px;border-left:4px solid #f59e0b}
.notice.err{background:#fff0f0;color:#a51f2a;border-color:#ef4444}
.notice.ok{background:#e9f8f1;color:#0e5e3f;border-color:#10b981}

/* ===========================
   CSS DU TEST (CORRIGÉ AVEC !IMPORTANT)
   =========================== */
#examView{display:none;position:fixed;inset:0;background:#f4f7fc;z-index:2000;overflow-y:auto;padding-bottom:100px}
.exam-header{background:#132344;color:#fff;padding:15px 25px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.exam-header h2{margin:0;font-size:18px}
.exam-body{max-width:800px;margin:25px auto;padding:0 20px}
.exam-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:25px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.02)}
.exam-card h3{font-size:17px;margin-top:0;margin-bottom:20px;line-height:1.5;color:#1e293b;text-align:left}
.exam-q-num{display:inline-block;background:var(--blue);color:#fff;font-weight:800;font-size:11px;padding:4px 10px;border-radius:99px;margin-bottom:12px}

/* LE FIX EST ICI : on force le flex et l'alignement */
.exam-options { display: flex !important; flex-direction: column !important; gap: 12px !important; width: 100% !important; }
.exam-opt { 
  display: flex !important; 
  flex-direction: row !important; 
  align-items: flex-start !important; 
  justify-content: flex-start !important;
  gap: 15px !important; 
  padding: 16px !important; 
  border: 1.5px solid var(--line) !important; 
  border-radius: 10px !important; 
  cursor: pointer !important; 
  background: #fff !important;
  transition: .1s !important;
  text-align: left !important;
}
.exam-opt:hover { background: #f8faff !important; border-color: #a9bce7 !important; }
.exam-opt.selected { border-color: var(--blue) !important; background: #edf2ff !important; }
.exam-opt.correct { border-color: var(--green) !important; background: #e9f8f1 !important; }
.exam-opt.wrong { border-color: var(--red) !important; background: #fff1f2 !important; }

/* Le bouton radio reste petit à gauche */
.exam-opt input[type="radio"], .exam-opt input[type="checkbox"] { 
  margin: 2px 0 0 0 !important; 
  padding: 0 !important;
  width: 20px !important; 
  height: 20px !important;
  cursor: pointer !important; 
  flex-shrink: 0 !important; 
  display: inline-block !important;
}
/* Le texte prend toute la place à droite */
.exam-opt span { 
  flex: 1 !important; 
  text-align: left !important; 
  line-height: 1.4 !important;
  word-wrap: break-word !important;
  display: block !important;
}

.exam-input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;margin-top:10px;text-align:left}

/* BARRE D'ACTIONS EN BAS */
.exam-actions{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:15px 25px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:10;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.exam-actions-left { font-size: 14px; color: var(--muted); font-weight: bold; }
.exam-actions-right { display: flex; gap: 10px; }

.exam-result-box{background:#e9f8f1;padding:18px;border-radius:10px;margin-top:20px;border-left:4px solid var(--green);font-size:14px;text-align:left}
.exam-result-box.wrong{background:#fff1f2;border-color:var(--red)}
.exam-explain{font-size:13px;color:#475569;margin-top:12px;padding:12px;background:#f8faff;border-radius:8px;border-left:2px solid var(--blue)}

@media(max-width:600px){ 
  .grid-2{grid-template-columns:1fr} 
  .exam-body{padding:0 12px} 
  .exam-actions { flex-direction: column; gap: 10px; padding: 10px; }
  .exam-actions-right { width: 100%; justify-content: space-between; }
  .exam-actions-right button { flex: 1; }
}
</style>
</head><body>

<header>
  <div class="brand">Compo<span>Test</span></div>
</header>

<main class="wrap">
  <div class="panel">
    <h1 id="appTitle">📚 Importer un document</h1>
    <p style="color:var(--muted);margin-top:-10px">Choisissez un fichier pour générer un nouveau quiz ou extraire des questions existantes.</p>

    <div class="grid-2">
      <div>
        <label for="quizTitle">Titre du test</label>
        <input id="quizTitle" placeholder="Ex. Examen Blanc" value="">
      </div>
      <div>
        <label for="quizSubject">Matière</label>
        <input id="quizSubject" placeholder="Ex. Immunologie">
      </div>
    </div>

    <label>Fichier source (PDF, Word, TXT)</label>
    <div class="filebox">
      <input id="pdfFile" type="file" accept=".pdf,.docx,.txt" style="display:none">
      <button class="secondary" onclick="document.getElementById('pdfFile').click()">📄 Choisir un fichier</button>
      <span id="fileName" style="margin-left:10px;font-weight:600;font-size:14px;color:var(--blue)">Aucun fichier sélectionné</span>
      <div id="pdfStatus" style="font-size:12px;color:var(--muted);margin-top:10px">Formats : PDF, DOCX, TXT</div>
    </div>

    <div id="textAreaWrap" class="hide" style="margin-top:20px">
      <label for="pdfText">Texte extrait (vérifiez et modifiez si besoin)</label>
      <textarea id="pdfText" style="min-height:150px" placeholder="Le texte apparaîtra ici."></textarea>
    </div>

    <div class="actions" id="actionButtons" style="margin-top:25px;display:none;justify-content:center;gap:20px">
      <button id="generatePostTestBtn" class="success" style="flex:1;max-width:300px;text-align:left;padding:15px;">
        <div style="font-size:16px;font-weight:800;margin-bottom:4px">✨ GÉNÉRER 50 QUESTIONS (IA)</div>
        <div style="font-size:11px;font-weight:normal;opacity:0.9">Créer un post-test à partir d'un cours.</div>
      </button>
      
      <button id="extractTestBtn" class="secondary" style="flex:1;max-width:300px;text-align:left;padding:15px;">
        <div style="font-size:16px;font-weight:800;margin-bottom:4px">📋 EXTRAIRE UN QUESTIONNAIRE</div>
        <div style="font-size:11px;font-weight:normal;opacity:0.9">Si le document contient déjà des questions.</div>
      </button>
    </div>

    <div id="analysisStatus" class="notice hide"></div>
  </div>
</main>

<div id="examView">
  <div class="exam-header">
    <div>
      <h2 id="examTitle">Test</h2>
      <div id="examMeta" style="font-size:12px;opacity:.8"></div>
    </div>
    <button class="ghost" id="examQuitBtn" style="background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.3)">← Quitter</button>
  </div>
  
  <div class="exam-body" id="examBody"></div>

  <div class="exam-actions" id="examActionsBar">
    <div class="exam-actions-left" id="examProgressText">Question 1 / 50</div>
    <div class="exam-actions-right">
      <button id="examPrevBtn" class="secondary">Précédent</button>
      <button id="examNextBtn">Suivant →</button>
      <button id="examSubmitBtn" class="success" style="display:none">✓ SOUMETTRE LA COMPO</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let examState = null;
let supabaseClient = null;
const cfg = window.COMPOSTEST_CONFIG || {};
if(window.supabase && cfg.SUPABASE_URL) {
  supabaseClient = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

$('pdfFile').addEventListener('change', async function() {
  if(this.files.length > 0) {
    $('fileName').textContent = this.files[0].name;
    const status=$('pdfStatus');
    status.textContent='Extraction...';
    try {
      let text = '';
      const file = this.files[0];
      const name = file.name.toLowerCase();
      if(name.endsWith('.pdf')){
        const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
        let pages=[];
        for(let p=1;p<=pdf.numPages;p++){
          const page=await pdf.getPage(p);
          const content=await page.getTextContent();
          pages.push(content.items.map(i=>i.str).join(' '));
        }
        text=pages.join('\n');
      } else if(name.endsWith('.docx')){
        const zip=await JSZip.loadAsync(await file.arrayBuffer());
        const docXml=zip.file('word/document.xml');
        const xml=await docXml.async('string');
        text = xml.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
      } else {
        text=await file.text();
      }
      $('pdfText').value = text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,'');
      $('textAreaWrap').classList.remove('hide');
      $('actionButtons').style.display = 'flex';
      status.textContent = `✅ ${text.length} caractères.`;
    } catch(e) {
      status.textContent = 'Erreur : ' + e.message;
    }
  }
});

async function fetchWithAuth(url, body) {
  if (!supabaseClient) throw new Error("Supabase non initialisé.");
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) throw new Error("Connectez-vous d'abord.");
  
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
    body: JSON.stringify(body)
  });
  
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Erreur serveur');
  return data;
}

$('generatePostTestBtn').addEventListener('click', async () => {
  const text = $('pdfText').value.trim();
  if(!text) return;
  
  const btn = $('generatePostTestBtn');
  btn.innerHTML = '⏳ Génération (50 Q)...';
  btn.disabled = true;
  $('analysisStatus').className = 'notice';
  $('analysisStatus').textContent = 'L\'IA analyse et génère 50 questions...';
  
  try {
    const data = await fetchWithAuth('/api/generate-post-test', {
      subject: $('quizSubject').value.trim() || 'Cours',
      title: $('quizTitle').value.trim() || 'Post-Test',
      sourceText: text
    });
    
    if(data.questions && data.questions.length > 0) {
      $('analysisStatus').className = 'notice ok';
      $('analysisStatus').textContent = `✅ ${data.questions.length} questions générées !`;
      startExam({ title: 'Post-Test IA', questions: data.questions });
    }
  } catch (err) {
    $('analysisStatus').className = 'notice err';
    $('analysisStatus').textContent = '❌ ' + err.message;
  } finally {
    btn.innerHTML = '✨ GÉNÉRER 50 QUESTIONS (IA)';
    btn.disabled = false;
  }
});

$('extractTestBtn').addEventListener('click', async () => {
  const text = $('pdfText').value;
  if(!text) return;
  
  $('analysisStatus').className = 'notice';
  $('analysisStatus').textContent = 'Extraction des questions...';

  try {
    const data = await fetchWithAuth('/api/parse-existing-quiz', { text });
    if(data.questions && data.questions.length > 0) {
      $('analysisStatus').className = 'notice ok';
      $('analysisStatus').textContent = `✅ ${data.questions.length} questions extraites !`;
      startExam({ title: 'Questionnaire importé', questions: data.questions });
    } else {
      $('analysisStatus').className = 'notice err';
      $('analysisStatus').textContent = '❌ Aucune question trouvée.';
    }
  } catch (err) {
    $('analysisStatus').className = 'notice err';
    $('analysisStatus').textContent = '❌ ' + err.message;
  }
});

function startExam(quiz) {
  examState = { title: quiz.title, questions: quiz.questions, answers: new Array(quiz.questions.length).fill(null), currentIndex: 0, submitted: false };
  $('examTitle').textContent = quiz.title;
  $('examMeta').textContent = `${quiz.questions.length} questions`;
  $('examView').style.display = 'block';
  document.body.style.overflow = 'hidden';
  renderExamQuestion();
}

$('examQuitBtn').addEventListener('click', () => {
  if(!examState.submitted && !confirm('Quitter ? Les réponses seront perdues.')) return;
  $('examView').style.display = 'none';
  document.body.style.overflow = 'auto';
  examState = null;
});

function renderExamQuestion() {
  const i = examState.currentIndex;
  const q = examState.questions[i];
  const ua = examState.answers[i];
  const total = examState.questions.length;

  $('examProgressText').textContent = `Question ${i + 1} / ${total}`;
  
  // Gestion de l'affichage des boutons
  $('examPrevBtn').style.display = i > 0 ? 'block' : 'none';
  
  if (i === total - 1) {
    $('examNextBtn').style.display = 'none';
    $('examSubmitBtn').style.display = 'block';
  } else {
    $('examNextBtn').style.display = 'block';
    $('examSubmitBtn').style.display = 'none';
  }

  let html = `<div class="exam-card"><span class="exam-q-num">Q${i + 1}</span><h3>${esc(q.text)}</h3>`;
    
  if(q.options && q.options.length > 0) {
    html += `<div class="exam-options">`;
    q.options.forEach((opt, j) => {
      const isMulti = q.type === 'mcq_multi' || (Array.isArray(q.correct) && q.correct.length > 1);
      const isSelected = isMulti ? (Array.isArray(ua) && ua.includes(j)) : (ua === j);
      let cls = 'exam-opt' + (isSelected ? ' selected' : '');
      
      if(examState.submitted) {
        const isCorrect = isMulti ? q.correct.includes(j) : q.correct === j;
        if(isCorrect) cls += ' correct'; else if(isSelected && !isCorrect) cls += ' wrong';
      }
      
      html += `<label class="${cls}">
        <input type="${isMulti ? 'checkbox' : 'radio'}" name="q${i}" value="${j}" ${isSelected ? 'checked' : ''} ${examState.submitted ? 'disabled' : ''}>
        <span>${esc(opt)}</span>
      </label>`;
    });
    html += `</div>`;
  } else {
    html += `<input type="text" class="exam-input" id="textInput" value="${esc(ua || '')}" ${examState.submitted ? 'disabled' : ''} placeholder="Votre réponse...">`;
  }

  if(examState.submitted) {
    const isOk = checkAnswer(q, ua);
    let correctStr = q.options && q.options[q.correct] ? q.options[q.correct] : '';
    html += `<div class="exam-result-box ${isOk ? '' : 'wrong'}"><b>${isOk ? '✅ Correct' : '❌ Incorrect'}</b>${correctStr ? `<br><b>Bonne réponse :</b> ${esc(correctStr)}` : ''}${q.explanation ? `<div class="exam-explain"><b>Explication :</b> ${esc(q.explanation)}</div>` : ''}</div>`;
  }

  html += `</div>`;
  $('examBody').innerHTML = html;

  if(!examState.submitted) {
    document.querySelectorAll(`input[name="q${i}"]`).forEach(inp => {
      inp.addEventListener('change', () => {
        const isMulti = q.type === 'mcq_multi' || (Array.isArray(q.correct) && q.correct.length > 1);
        if(isMulti) examState.answers[i] = [...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(x => parseInt(x.value));
        else examState.answers[i] = parseInt(inp.value);
      });
    });
    const textInp = $('textInput');
    if(textInp) textInp.addEventListener('input', (e) => examState.answers[i] = e.target.value);
  }
}

function checkAnswer(q, ua) {
  if (ua === null || ua === undefined) return false;
  if (q.type === 'mcq' || q.type === 'tf') return ua === q.correct;
  if (q.type === 'mcq_multi') {
     if(!Array.isArray(ua)) return false;
     const a = [...ua].sort(); const b = [...q.correct].sort();
     return a.length === b.length && a.every((v,i) => v === b[i]);
  }
  if (q.type === 'short') return String(ua).toLowerCase().trim() === String(q.correct).toLowerCase().trim();
  return false;
}

$('examNextBtn').addEventListener('click', () => { 
  if(examState.currentIndex < examState.questions.length - 1) { 
    examState.currentIndex++; 
    renderExamQuestion(); 
  } 
});

$('examPrevBtn').addEventListener('click', () => { 
  if(examState.currentIndex > 0) { 
    examState.currentIndex--; 
    renderExamQuestion(); 
  } 
});

$('examSubmitBtn').addEventListener('click', () => {
  if(examState.submitted) return;
  if(!confirm('Soumettre le test et voir la correction ?')) return;
  
  examState.submitted = true;
  
  $('examNextBtn').style.display = 'none';
  $('examPrevBtn').style.display = 'none';
  $('examSubmitBtn').style.display = 'none';
  
  let correctCount = 0;
  examState.questions.forEach((q, i) => {
    if(checkAnswer(q, examState.answers[i])) correctCount++;
  });
  
  const score = (correctCount / examState.questions.length * 20).toFixed(1);
  $('examProgressText').innerHTML = `<b style="color:var(--green);font-size:16px">Note : ${score}/20 (${correctCount}/${examState.questions.length})</b>`;
  
  examState.currentIndex = 0;
  renderExamQuestion();
});
</script>
</body></html>
